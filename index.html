<!doctype html>
<html lang="en-US" data-theme="light" data-accent="cinnabar" data-background="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private, self-hosted Markdown notebook built on Cloudflare." />
    <meta name="theme-color" content="#1a1817" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="icsio" />
    <title>icsio</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f8df7'/%3E%3Cstop offset='.52' stop-color='%237fb0ff'/%3E%3Cstop offset='1' stop-color='%23eaf3ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='5' y='5' width='54' height='54' rx='17' fill='url(%23g)' stroke='%231d4ed8' stroke-opacity='.14'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cline x1='19.5' y1='24' x2='19.5' y2='40'/%3E%3Cline x1='15' y1='24' x2='24' y2='24'/%3E%3Cline x1='15' y1='40' x2='24' y2='40'/%3E%3Cpath d='M 47 25.5 A 9.5 9.5 0 1 0 47 38.5'/%3E%3C/g%3E%3C/svg%3E"
    />


    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('icsio.ui')
          var saved = raw ? JSON.parse(raw) : null
          var pref = (saved && saved.theme) || 'system'
          var accent = (saved && saved.accent) || 'cinnabar'
          var background = saved && saved.background === 'white' ? 'white' : 'paper'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.dataset.accent = accent
          root.dataset.background = background
          var storedLocale = localStorage.getItem('icsio-locale')
          var locale =
            storedLocale === 'zh-CN' || storedLocale === 'en-US'
              ? storedLocale
              : saved && (saved.language === 'zh-CN' || saved.language === 'en-US')
                ? saved.language
                : navigator.language.toLowerCase().startsWith('zh')
                  ? 'zh-CN'
                  : 'en-US'
          root.lang = locale
          document.title = 'icsio'
          var description = document.querySelector('meta[name="description"]')
          if (description) {
            description.content = 'A private, self-hosted Markdown notebook built on Cloudflare.'
          }
          if (saved && saved.fontScale) {
            root.style.setProperty('--prose-size', saved.fontScale + 'px')
          }
        } catch (e) {

        }
      })()
    </script>

    <style>

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: light-dark(#faf9f7, #1a1817);
        z-index: 9999;
        transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-theme='light'] #boot { background: #faf9f7; }
      html[data-theme='light'][data-background='white'] #boot { background: #fff; }
      html[data-theme='dark'] #boot { background: #1a1817; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot svg { width: 34px; height: 34px; animation: bootPulse 1.5s ease-in-out infinite; }
      @keyframes bootPulse {
        0%, 100% { opacity: 0.28; transform: scale(0.97); }
        50% { opacity: 0.85; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="boot-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4f8df7" />
            <stop offset="0.52" stop-color="#7fb0ff" />
            <stop offset="1" stop-color="#eaf3ff" />
          </linearGradient>
          <linearGradient id="boot-sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <clipPath id="boot-clip">
            <rect x="5" y="5" width="54" height="54" rx="17" />
          </clipPath>
        </defs>
        <rect x="5" y="5" width="54" height="54" rx="17" fill="url(#boot-grad)" />
        <rect x="5" y="5" width="54" height="54" rx="17" fill="none" stroke="#1d4ed8" stroke-opacity="0.14" stroke-width="1.5" />
        <g clip-path="url(#boot-clip)">
          <rect x="5" y="5" width="54" height="30" fill="url(#boot-sheen)" />
        </g>
        <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19.5" y1="24" x2="19.5" y2="40" />
          <line x1="15" y1="24" x2="24" y2="24" />
          <line x1="15" y1="40" x2="24" y2="40" />
          <path d="M 47 25.5 A 9.5 9.5 0 1 0 47 38.5" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
