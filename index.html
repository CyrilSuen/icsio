<!doctype html>
<html lang="en-US" data-theme="light" data-accent="cinnabar" data-background="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private, self-hosted Markdown notebook built on Cloudflare." />
    <meta name="theme-color" content="#1a1817" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="icsio" />
    <title>icsio</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2.5' y='2.5' width='27' height='27' rx='8.5' fill='%23202124'/%3E%3Cg fill='%23bb4430'%3E%3Ccircle cx='12.6' cy='9.6' r='1.9'/%3E%3Crect x='11.3' y='13.6' width='2.6' height='10.2' rx='1.3'/%3E%3C/g%3E%3Cpath d='M24.50 16.78 A4.3 4.3 0 1 0 24.50 20.42' fill='none' stroke='%23bb4430' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />


    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('icsio.ui')
          var saved = raw ? JSON.parse(raw) : null
          var pref = (saved && saved.theme) || 'system'
          var accent = (saved && saved.accent) || 'cinnabar'
          var background = saved && saved.background === 'white' ? 'white' : 'paper'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.dataset.accent = accent
          root.dataset.background = background
          var storedLocale = localStorage.getItem('icsio-locale')
          var locale =
            storedLocale === 'zh-CN' || storedLocale === 'en-US'
              ? storedLocale
              : saved && (saved.language === 'zh-CN' || saved.language === 'en-US')
                ? saved.language
                : navigator.language.toLowerCase().startsWith('zh')
                  ? 'zh-CN'
                  : 'en-US'
          root.lang = locale
          document.title = 'icsio'
          var description = document.querySelector('meta[name="description"]')
          if (description) {
            description.content = 'A private, self-hosted Markdown notebook built on Cloudflare.'
          }
          if (saved && saved.fontScale) {
            root.style.setProperty('--prose-size', saved.fontScale + 'px')
          }
        } catch (e) {

        }
      })()
    </script>

    <style>

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: light-dark(#faf9f7, #1a1817);
        z-index: 9999;
        transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-theme='light'] #boot { background: #faf9f7; }
      html[data-theme='light'][data-background='white'] #boot { background: #fff; }
      html[data-theme='dark'] #boot { background: #1a1817; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot svg { width: 34px; height: 34px; animation: bootPulse 1.5s ease-in-out infinite; }
      @keyframes bootPulse {
        0%, 100% { opacity: 0.28; transform: scale(0.97); }
        50% { opacity: 0.85; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="7.4" stroke="#b5482e" stroke-width="2.2" />
        <circle cx="12.6" cy="9.6" r="1.9" fill="#b5482e" />
        <rect x="11.3" y="13.6" width="2.6" height="10.2" rx="1.3" fill="#b5482e" />
        <path d="M24.50 16.78 A4.3 4.3 0 1 0 24.50 20.42" stroke="#b5482e" stroke-width="2.6" stroke-linecap="round" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
