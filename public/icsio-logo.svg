  </defs>
  <rect x="5" y="5" width="54" height="54" rx="17" fill="url(#g)"/>
  <rect x="5" y="5" width="54" height="54" rx="17" fill="none" stroke="#1d4ed8" stroke-opacity="0.14" stroke-width="1.5"/>
  <g clip-path="url(#tile)">
