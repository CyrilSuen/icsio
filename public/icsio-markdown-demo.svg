<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title description">
  <title id="title">icsio Markdown image example</title>
  <desc id="description">The icsio project logo beside text confirming that Markdown images render correctly.</desc>
  <rect width="720" height="240" rx="28" fill="#f5f4f1"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a9cf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <g transform="translate(42 42) scale(4.875)">
    <rect x="2.5" y="2.5" width="27" height="27" rx="8.5" fill="url(#g)"/>
    <g fill="#ffffff">
      <rect x="5" y="7" width="10" height="2"/><rect x="5" y="9" width="10" height="2"/><rect x="9" y="11" width="4" height="10"/><rect x="5" y="21" width="10" height="2"/><rect x="5" y="23" width="10" height="2"/>
      <rect x="17" y="7" width="10" height="2"/><rect x="17" y="9" width="10" height="2"/><rect x="17" y="11" width="4" height="10"/><rect x="17" y="21" width="10" height="2"/><rect x="17" y="23" width="10" height="2"/>
    </g>
  </g>
  <text x="238" y="112" fill="#202124" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700">icsio</text>
  <text x="238" y="158" fill="#686763" font-family="Inter, system-ui, sans-serif" font-size="24">Markdown image example</text>
</svg>
